name: JavaScript syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          if [ -d js ]; then
            find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          else
            echo "Diretório js ainda não foi importado; nada para validar."
          fi
