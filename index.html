<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa em Jogo — V0.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="start" class="screen active">
  <div class="startbox">
    <div class="logo"><span>CASA</span><b>EM JOGO</b><small>V0.5 • REALITY SOCIAL</small></div>
    <div class="creator">
      <h1>Crie seu participante</h1>
      <label>Nome</label>
      <input id="name" maxlength="16" value="Theo">
      <label>Perfil inicial</label>
      <div class="traits">
        <button data-trait="Social" class="trait selected">🤝 Social</button>
        <button data-trait="Competitivo" class="trait">🏆 Competitivo</button>
        <button data-trait="Provocador" class="trait">🔥 Provocador</button>
        <button data-trait="Observador" class="trait">👁 Observador</button>
      </div>
      <label>Cor</label><div id="colors" class="colors"></div>
      <button id="play" class="primary">ENTRAR NA CASA</button>
      <p class="note">Offline • sem instalação • cenário enviado por você</p>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <main class="stage">
    <canvas id="canvas" width="1024" height="765"></canvas>
    <div id="topHud">
      <div>⚡ <b id="energy">100</b></div>
      <div>🤝 <b id="social">50</b></div>
      <div>⭐ <b id="rep">50</b></div>
      <div>🪙 <b id="coins">500</b></div>
    </div>
    <div id="roomBadge">SALA</div>
    <div id="prompt">WASD/setas • E conversar • F ação/porta</div>
  </main>

  <aside>
    <header><h2>CASA EM JOGO</h2><span>TEMPORADA 1</span></header>
    <div class="status">
      <b id="round">RODADA 1</b>
      <strong id="timer">01:10</strong>
      <small id="event"></small>
      <div class="buttons">
        <button id="musicBtn">♫ Música ON</button>
        <button id="gossipBtn">📺 Fofocas</button><button id="relBtn">🤝 Relações</button>
      </div>
    </div>
    <h3>PARTICIPANTES</h3><div id="players"></div>
    <h3>ACONTECIMENTOS</h3><div id="feed"></div>
  </aside>
</section>

<div id="modal" class="modal hidden">
  <div class="panel">
    <i></i><h2 id="modalTitle"></h2><p id="modalText"></p><div id="choices"></div>
  </div>
</div>

<div id="dialogue" class="dialogue hidden">
      <div id="portrait" class="portrait"></div>
      <div class="dialogue-main">
        <div id="speaker" class="speaker">Luna</div>
        <div id="dialogueText" class="dialogue-text"></div>
        <div id="dialogueChoices" class="dialogue-choices"></div>
        <div id="dialogueHint" class="dialogue-hint">ESPAÇO para continuar</div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>

<script src="game.js"></script>
</body>
</html>
